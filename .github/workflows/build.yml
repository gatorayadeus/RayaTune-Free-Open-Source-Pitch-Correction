name: Build RayaTune
on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: Windows }
          - { os: macos-latest,   name: macOS }
          - { os: ubuntu-latest,  name: Linux }
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev \
            libxrender-dev libgl1-mesa-dev

      - name: Pruebas DSP
        if: runner.os == 'Linux'
        run: |
          g++ -O2 -std=c++17 -ISource/DSP tests/dsp_test.cpp -o dsp_test
          ./dsp_test

      - name: Configurar
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Compilar
        run: cmake --build build --config Release -j 4

      - name: Subir VST3
        uses: actions/upload-artifact@v4
        with:
          name: RayaTune-VST3-${{ matrix.name }}
          path: build/RayaTune_artefacts/*/VST3/
          if-no-files-found: error

      - name: Subir Standalone
        uses: actions/upload-artifact@v4
        with:
          name: RayaTune-Standalone-${{ matrix.name }}
          path: build/RayaTune_artefacts/*/Standalone/
          if-no-files-found: warn
